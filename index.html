<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1> Biblioteca de jogos </h1>
        <p> Venda de jogos </p>
    </header>
    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2> Nosso catalogo </h2>
                <P> Coneheça os jogos disponíveis </P>
            </div>
            <button id="btnCadastrar" type="button">+ Cadastrar jogo
            </button>
        </div>
        <selection id="listarJogos" class="listar-jogos">
            <p id="mensagemVazia"> Nenhum jogo cadastrado </p>
        </selection>
    </main>
    <dialog id="modalCadastro">
        <h2>Novo jogo</h2>
        <form id="formJogo">
            <label for="jogo"> Nome do jogo</label>
            <input type="test" id="jogo" required>
            <label for="developer">Nome do developer(s)</label>
            <input type="text" id="developer" required>
            <label for="genero">Gênero</label>
            <input type="text" id="genero" required>
            <label for="imagem">URL da imagem do jogo</label>
            <input type="url" id="imagem" placeholder="https://site.com/capa.jpg" required>
            <label for="preco"> Preço (R$)</label>
            <input type="number" id="preco">
            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
